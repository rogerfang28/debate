syntax = "proto3";

package ui;

message Page {
  string page_id = 1;                 // Unique page identifier
  string title = 2;                   // Page title (optional)
  repeated Component components = 3;  // Top-level components
}

message Component {
  string id = 1;                       // Unique component ID
  string name = 2;                      // Component name
  ComponentType type = 3;              // Predefined component type
  string text = 4;                     // I don't know what I'll replace this with if I remove it, maybe just making components each have their own classes
  repeated Component children = 5;     // Nested components
  Style style = 6;                     // Tailwind / structured style info
  map<string, string> css = 8;         // Arbitrary inline CSS (fallback/flexibility)
  map<string, string> attributes = 7;  // Arbitrary HTML attributes (e.g., data-* attrs)
  // string value = 9;                   // Default or bound value
  // Graph data — only used when type == GRAPH
  repeated GraphNode nodes = 10;
  repeated GraphEdge edges = 11;
  string selected_node_id = 12;
  string selected_edge_id = 13;
}

enum ComponentType {
  UNKNOWN = 0;
  TEXT = 1;
  BUTTON = 2;
  INPUT = 3;
  GRAPH = 4;
  CONTAINER = 12;
  CLAIM_PARSER = 14;
  // Renders a <select>. Options travel in `attributes` as "options" (a
  // comma-separated list) and "value" (the initially selected one), reusing the
  // existing escape hatch rather than adding fields only one type would use.
  DROPDOWN = 15;

  // A text input the viewer can duplicate: one box plus an "add another"
  // button that appends more, client-side.
  //
  // Growing the list is deliberately NOT a server round trip. The page is
  // re-rendered per request, so a server-driven version would have to carry
  // every typed value back out and echo it into the new markup, or lose the
  // user's text each time they added a box. Nothing else needs to change,
  // because getEntirePage collects `input[id]` generically -- boxes the
  // client adds are picked up with no protocol change at all.
  //
  // Ids follow <id>, <id>2, <id>3, ... which is what the backend parsers
  // already prefix-match on.
  //
  // attributes: placeholder, extraPlaceholder, addLabel, maxInputs
  MULTI_INPUT = 16;

  // A multi-line text box. ComponentRenderer has always mapped this type; the
  // enum value simply never existed, so the mapping was unreachable.
  TEXTAREA = 17;

  // A picture: attribute `src` is its web address, `text` its alt text. Like TEXT,
  // an attribute data-href makes it a link (to the full-size picture).
  // ComponentRenderer has long mapped IMAGE; the enum value was missing.
  IMAGE = 18;
}

message Style {
  string custom_class = 1;            // Any extra Tailwind classes FOR NOW WE ONLY USING THIS
}

enum LayoutType {
  ABSLT = 0;
  FLEX_ROW = 1;
  FLEX_COL = 2;
  GRID = 3;
  INLINE = 4;
}

message Position {
  float x = 1; // px or % depending on renderer
  float y = 2;
  string unit = 3; // "px", "%", "rem"
}

message Size {
  string width = 1;  // Tailwind width class or explicit value
  string height = 2; // Tailwind height class or explicit value
}

message GraphNode {
  string id = 1;          // Unique node identifier
  string text = 2;        // Claim/sentence text
  double x = 3;           // Optional initial x position
  double y = 4;           // Optional initial y position
  string type = 5;        // "claim" | "evidence" | "challenge" | ""
  string status = 6;      // "TRUE_CLAIM" | "FALSE_CLAIM" | "UNDETERMINED"
  int32 creator_id = 7;   // Creator user ID
  bool is_root = 8;       // Renders larger if true
  bool is_current = 9;    // Highlights with yellow stroke if true
  string creator_username = 10; // Resolved creator username
}

message GraphEdge {
  string id = 1;          // Unique edge identifier
  string source = 2;      // Source node ID
  string target = 3;      // Target node ID
  string type = 4;        // "supports" | "challenges" | "counters" | "PARENT_CHILD" | "CHALLENGE"

  // What KIND of connection this is -- EVIDENTIAL | AUTHORITY | DEFINITIONAL |
  // NORMATIVE. Labels the junction node the renderer draws for this edge.
  //
  // May be empty, and may hold the pre-dropdown placeholder string, because
  // relations created before the basis existed have no real value. The renderer
  // decides what to show for those; it is not this layer's job to invent one.
  string basis = 5;

  // Which stored relation produced this edge.
  //
  // A relation with several from-claims arrives as several edges that share
  // this id, and the renderer draws ONE junction for the group -- that is what
  // makes "these three claims TOGETHER support that one" visually distinct
  // from three independent supports of the same claim. Without it the renderer
  // cannot tell those apart, because both are N edges into one target.
  //
  // 0 when unknown; the renderer then treats the edge as its own relation.
  int32 relation_id = 6;

  // For a challenge aimed at an ARGUMENT: the relation whose junction (pill)
  // this edge should end at, instead of the claim in `target`. `target` still
  // names the claim that argument was for, so a renderer that knows nothing
  // of relation targets still draws something sensible. 0 for edges aimed at
  // a claim.
  int32 target_relation_id = 7;
}

message GraphComponent {
  string id = 1;                    // Component ID
  repeated GraphNode nodes = 2;     // Debate tree nodes
  repeated GraphEdge edges = 3;     // Edges between nodes
  string selected_node_id = 4;      // Initially selected node
  string selected_edge_id = 5;      // Initially selected edge
}

