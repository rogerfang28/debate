// so I can't come up with a name for this, it should be like a proto that is sent from the debate moderator to the client
syntax = "proto3";

package moderator_to_vr;

// import "debate.proto";
import "user.proto";
import "collection.proto";

message ModeratorToVRMessage {
    user.User user = 1;
    debate.Collection collection = 2;
    DebateList debate_list = 3; // specifically for home page
    // The profile open on the home page (engagement.home_view.profile_user_id).
    Profile profile = 4;
    // The admin's activity log, only when an admin has it open on their own
    // profile (engagement.home_view.activity_open).
    ActivityReport activity = 5;
}

// What the activity log shows an admin: who visited, signed in and acted,
// summed and listed. Built from the ACTIVITY table (visits, sign-ins, opens,
// account changes) and the MOVES table (actions in debates). Times are UTC.
message ActivityReport {
    int64 generated_at_ms = 1;
    ActivitySummary last_day = 2;     // the last 24 hours
    ActivitySummary last_week = 3;    // the last 7 days
    repeated ActivityDay days = 4;    // the last 14 UTC days, newest first
    repeated ActivityTopDebate top_debates = 5;  // most opened, last 7 days
    repeated ActivityEntry recent = 6;           // newest first
    string filter = 7;                // "all" | "members" | "visitors"
}

message ActivitySummary {
    int32 visitors = 1;        // distinct visitors seen
    int32 members = 2;         // distinct members seen
    int32 sign_ins = 3;        // sign-ins to existing accounts
    int32 new_accounts = 4;
    int32 actions = 5;         // every action in a debate
    int32 agrees = 6;
    int32 challenges = 7;
    int32 claims = 8;          // supports and new debates
    int32 debates_opened = 9;
}

message ActivityDay {
    string date = 1;           // "2026-10-29" (UTC)
    int32 visitors = 2;
    int32 members = 3;
    int32 sign_ins = 4;
    int32 new_accounts = 5;
    int32 actions = 6;
}

message ActivityTopDebate {
    int32 debate_id = 1;
    string title = 2;
    int32 opens = 3;
    int32 people = 4;          // distinct people who opened it
}

message ActivityEntry {
    int64 at_ms = 1;
    int32 user_id = 2;
    string username = 3;       // as it was then (a debate action: as it is now)
    bool member = 4;           // false: a visitor
    // visit, sign_in, sign_up, sign_out, open_debate, brief, chat, import,
    // rename, delete_account; and from the move log: new_debate, support,
    // challenge, agree, withdraw, concede, delete.
    string kind = 5;
    int32 debate_id = 6;
    string debate_title = 7;
    int32 claim_id = 8;
    string claim_text = 9;
    string detail = 10;
}

// A person's public profile: who they are and what they have done, summed
// over every debate's card (DebateTopic.tallies, owed).
message Profile {
    int32 user_id = 1;
    string username = 2;
    // "member" | "voice" (passwordless, quoted from sources) | "visitor" |
    // "deleted" | "missing". Only members and voices have a profile page.
    string kind = 3;
    int64 joined_at = 4;   // 0 = before join dates were kept
    int32 debates = 5;
    int32 claims = 6;
    int32 challenges = 7;
    int32 agreements = 8;
    int32 concessions = 9;
    // Open challenges waiting on this person right now (DebateBrief openByHolder).
    int32 open_challenges = 10;
    // The debates they take part in, by id (DebateTopic.id).
    repeated int32 debate_ids = 11;
    // The viewer is looking at their own profile.
    bool own = 12;
}

// One person's part in one debate, for their profile. Claims and challenges
// are counted by whose claim it is (the voice, else the entrant), so a voice
// is credited with what was entered in their name; agreements and
// concessions are the person's own moves.
message PersonTally {
    int32 user_id = 1;
    int32 claims = 2;
    int32 challenges = 3;
    int32 agreements = 4;   // standing ACCEPTs (one taken back does not count)
    int32 concessions = 5;
    // Claims in their voice entered by someone else: they are a voice.
    int32 voiced = 6;
}

message DebateTopic {
    int32 id = 1;
    string topic = 2;
    int32 creator_id = 3;
    bool is_challenge = 4;
    string claim_its_challenging = 5;
    // The home shelf's card, computed from the debate's Brief structure
    // (DebateBrief::Compute) when the home page is built.
    string root_text = 6;          // the main claim; empty if it has none
    string root_holder = 7;        // who claims it (the root's voice)
    bool unresolved = 8;           // some challenge is still unanswered
    string hinge_text = 9;         // when unresolved: the claim it hangs on
    int32 claim_count = 10;
    int32 stance_count = 11;       // people with a stance on the main claim
    int32 open_challenge_count = 12;
    repeated string involved = 13; // their names, stance order
    // When the debate last moved: the newest CREATED_AT in its move log, as
    // Unix seconds. 0 when it has no moves.
    int64 last_moved_at = 14;
    // Everyone with a claim or a stance in it (voices included).
    int32 people_count = 15;
    // Who owes replies and how many, most first (DebateBrief openByHolder).
    repeated OwingParty owing = 16;
    // Every open challenge, with the holder who owes the reply.
    repeated OwedReply owed = 17;
    repeated int32 member_ids = 18;
    // The debate's newest moves, newest first (at most 4).
    repeated RecentMove recent_moves = 19;
    // Cache only: every claim sentence, for Explore's search. Cleared on the
    // copy that goes into a response.
    repeated string claim_texts = 20;
    // Response only, when the viewer has an Explore query: whether the debate
    // matches it (title or any claim), and up to 2 matching claims.
    bool search_match = 21;
    repeated string matched_claims = 22;
    // Cache only: each person's part in this debate, for profiles. Cleared
    // on the copy that goes into a response.
    repeated PersonTally tallies = 23;
}

message OwingParty {
    string who = 1;
    int32 count = 2;
}

message OwedReply {
    string who = 1;
    int32 claim_id = 2;
    string text = 3;
}

message RecentMove {
    string who = 1;
    string verb = 2;     // challenged | replied | claimed | agreed | conceded
    int64 at = 3;        // Unix seconds
    int32 seq = 4;       // orders moves made in the same second
}

message DebateList {
    repeated DebateTopic topics = 1;
}