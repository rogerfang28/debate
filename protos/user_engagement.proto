syntax = "proto3";

package user_engagement;
import "debate.proto";

enum EngagementAction {
  ENGAGEMENT_ACTION_UNSPECIFIED = 0;
  ACTION_HOME     = 1;  // basically home page / idle
  ACTION_DEBATING = 2;  // currently in a debate
  ACTION_LOGIN    = 3;  // login page
}

// Progress and outcome of an AI job that is not a summary -- generating a
// debate, or asking for challenges. Lives on the engagement rather than in a
// page's own info because generation starts on the home page and finishes
// inside a debate: the job outlives the page that began it.
message AiJobStatus {
  bool pending = 1;
  int32 elapsed_seconds = 2;
  string error = 3;
  // What happened, once it has. Shown and then dismissed by the user.
  string note = 4;
  // Which debate this outcome describes. The status lives on the engagement
  // rather than in a page, because generation starts on the home page and
  // finishes inside a debate -- but that meant a notice from one debate
  // followed the user into the next, where "Generated a debate from 20 steps"
  // made a hand-built debate look AI-written.
  int32 about_debate_id = 5;
}

// Where the reader is in a guided walkthrough.
//
// Only the POSITION is stored -- which script, which step. The words shown in
// the guide box are read from the .pbtxt on every render, so editing a
// tutorial file changes what a half-finished walkthrough says without
// migrating anybody's saved state. Storing the text here would freeze a copy
// of it on each user and make the files stop being the source of truth.
//
// This lives on the engagement rather than on the debate for the same reason
// the AI job status does: a walkthrough starts on the home page and continues
// inside a debate, so it outlives either page.
message TutorialStatus {
  bool active = 1;
  // Filename stem under backend/tutorials/.
  string script = 2;
  // Index of the step now on screen -- the one whose action has already run.
  int32 step_index = 3;
  int32 total_steps = 4;
  // The debate the walkthrough built. Survives EXIT, so the reader can go back
  // and take apart what they watched being assembled.
  int32 debate_id = 5;
  // Every step has run. The guide box shows its closing panel rather than a
  // Next button.
  bool finished = 6;
  // A step that would not replay. Shown in place of the narration, because a
  // walkthrough that silently stops advancing is worse than one that says why.
  string error = 7;
}

message UserEngagement {
  EngagementAction current_action = 1;
  oneof action_info {
    HomeInfo     home_info     = 2;
    DebatingInfo debating_info = 3;
  }

  AiJobStatus ai_job = 4;
  TutorialStatus tutorial = 5;
  // Which home tab the reader is on, and their Explore search. Here rather
  // than in HomeInfo because HomeInfo shares a oneof with DebatingInfo and is
  // wiped by entering a debate: opening a case from Explore and coming back
  // should find the same tab, search, filter and sort.
  HomeView home_view = 6;
}

message HomeView {
  string home_tab = 1;        // "home" (default, also "") | "explore" | "mine"
  string explore_query = 2;   // case-insensitive substring of titles and claims
  string explore_filter = 3;  // "" | "open" | "settled" | "waiting"
  string explore_sort = 4;    // "moved" (default, also "") | "claims"
  // The create-a-debate dialog is open. Set by OPEN_CREATE_DEBATE, cleared
  // by CLOSE_CREATE_DEBATE and by creating or generating a debate.
  bool create_open = 5;
  // A person's profile, drawn on the home page in place of the tab. Set by
  // OPEN_PROFILE (a name pressed anywhere); cleared by choosing a tab, by
  // Explore's controls and by going home. 0 = no profile open.
  int32 profile_user_id = 6;
  // On your own profile, which inline step is open: "" | "rename" | "delete".
  string profile_panel = 7;
  // Why the last rename was refused, and the name that was tried, so the
  // form can say so in place with the name still in the box.
  string profile_error = 8;
  string profile_draft = 9;
  // An admin's import view, drawn on their own profile in place of it.
  // Set by IMPORT_OPEN; cleared, with the text and the preview, by
  // IMPORT_CLOSE, by a publish that worked, and by leaving the profile.
  bool import_open = 10;
  // The text that was last previewed. Kept so the box still holds it after
  // the preview, and so Publish builds exactly what was previewed.
  string import_text = 11;
  ImportPreview import_preview = 12;
}

// What Preview found in the import text. Nothing is written to make it.
message ImportPreview {
  // A preview has been run on import_text.
  bool done = 1;
  string format = 2;           // "scenario" | "outline"
  string root = 3;             // the root claim's text
  int32 claims = 4;            // every claim, the root included
  int32 supports = 5;
  int32 challenges = 6;
  // Every voice the debate uses, in first-use order; "" is never listed
  // (a claim with no voice is the importer's own).
  repeated string voices = 7;
  // The voices that are nobody yet: publishing creates an account for each.
  repeated string new_voices = 8;
  // Each problem, with its line (outline) or the parser's words (scenario).
  // Publish is offered only when there are none.
  repeated string errors = 9;
  repeated string warnings = 10;
  // Why the last Publish did not finish, said plainly.
  string publish_error = 11;
}

message HomeInfo {
  DebateList available_debates = 1; // list of debates user can join
}

message DebateTopic {
    int32 id = 1;
    string topic = 2;
    int32 creator_id = 3;
    bool is_challenge = 4;
    string claim_its_challenging = 5;
}

message DebateList {
    repeated DebateTopic topics = 1;
}

message DebatingInfo {
  int32 debate_id = 1;
  bool is_challenge = 16; // whether the current debate is a challenge debate
  bool modifying_current_claim = 9;
  message ModificationInfo {
    repeated ClaimInfo new_claims = 1;
    repeated LinkInfo new_links = 2;
    repeated int32 deleted_claim_ids = 3;
    repeated int32 deleted_link_ids = 4;
    
  }
  int32 challenged_user_id = 17;
  int32 challenger_user_id = 18;
  ClaimInfo current_claim = 2; // current claim being viewed/argued
  string current_claim_description = 3; // description of the current claim
  ClaimInfo parent_claim = 4;  // parent claim of the current claim
  ClaimInfo root_claim = 5;    // root claim of the debate
  repeated ClaimInfo children_claims = 6; // child claims of the current claim
  repeated LinkInfo links = 7; // links under the current claim
  repeated ChallengeInfo current_challenges = 8; // challenges against the current claim
  message CurrentDebateAction {
    enum ActionType {
      ACTION_TYPE_UNSPECIFIED = 0;
      VIEWING_CLAIM = 1; // normal state
      ADDING_CHILD_CLAIM = 2; // user is adding a claim
      // TODO remove field, was used for user manual linking claims
      CONNECTING_CLAIMS = 3; // user is connecting claims
      CHALLENGING_CLAIM = 4; // user is challenging the current claim
      EDITING_CLAIM_DESCRIPTION = 5; // user is editing the current claim description
      EDITING_CLAIM = 6; // user is editing the current claim sentence
      REPORTING_CLAIM = 7; // user is reporting the current claim
    }
    ActionType action_type = 1;
  }

  CurrentDebateAction current_debate_action = 11;

  // The old per-user summary fields; the AI chat replaced them.
  reserved 19, 20, 21, 22;

  // One turn of the AI chat.
  message ChatMessage {
    string role = 1;  // "user" or "assistant"
    string text = 2;
  }

  // The AI chat for the debate the user is in; see ChatHandler.
  //
  // The transcript lives in CHATS; this is a copy of its tail so the page
  // can draw it from the user record, plus what a run in flight looks
  // like. `pending` is never true across a restart -- AiJobs owns the run
  // and is the only thing that knows it is still alive.
  message ChatState {
    bool pending = 1;
    int32 elapsed_seconds = 2;
    repeated ChatMessage messages = 3;
    // Which debate `messages` belong to. When it is not the debate the user
    // is in, the copy is stale and is reloaded from CHATS.
    int32 debate_id = 4;
  }
  ChatState chat = 24;

  // The Brief tab's model run. The brief's WORDS are stored per debate in
  // BRIEFS and shared by every reader; this is only what one reader's run
  // in flight looks like, so the page can say "writing" and poll.
  message BriefState {
    bool pending = 1;
    int32 elapsed_seconds = 2;
    // Why the last run produced nothing, shown once and cleared by the next
    // run. Empty when the last run worked.
    string error = 3;
    // Which debate the run in flight is writing about, and the fingerprint
    // of the structure it was given -- the result is filed under both.
    int32 debate_id = 4;
    string fingerprint = 5;
    // The stored words for the debate the user is in, mirrored from BRIEFS
    // so the page can draw them from the user record (the chat transcript
    // rides the same way). `prose_fingerprint` says which structure they
    // describe; when the debate has moved on, the page says so.
    string prose_json = 6;
    string prose_fingerprint = 7;
  }
  BriefState brief = 25;
  // The claims the viewer holds by their own act -- asserted, or agreed and
  // not withdrawn -- from the move log. Filled per response (not stored), so
  // the claim panel can say WHY a claim is true or false for them, and warn
  // when two things they hold contradict each other.
  repeated int32 viewer_held_claim_ids = 26;

  // The ARGUMENT the viewer has selected in the graph -- a relation id -- or 0.
  // Selecting a relation also moves current_claim to the claim that argument
  // is for, so the panel and the challenge modal always work from a claim
  // that the selected argument hangs off. Cleared by any claim selection.
  int32 selected_link_id = 23;
  oneof additional_info {
    // could be none
    // TODO remove field, was used for user manual linking claims
    ConnectingInfo connecting_info = 12; // info about connecting claims
    ChallengingInfo challenging_info = 15; // info about challenging claims
  }

  // TODO remove field, was used for user manual linking claims
  message ConnectingInfo {
    int32 from_claim_id = 1;
    int32 to_claim_id   = 2;
    string connection = 3;
    bool connecting = 4;
    bool opened_connect_modal = 5;
  }

  message ChallengingInfo {
    repeated int32 claim_ids = 1; // claim ids to be challenged
    repeated int32 link_ids = 2; // link ids to be challenged
    string challenge_sentence = 3; // sentence for the challenge
    bool opened_challenge_modal = 4;
  }
}

message ClaimInfo {
  int32 id = 1;
  string sentence = 2;
  int32 creator_id = 3;
  debate.ClaimStatus status = 4;
}

message LinkInfo {
  int32 id = 1;
  int32 connect_from = 2;
  int32 connect_to = 3;
  string connection = 4;  
  int32 creator_id = 5;
}
message ChallengeInfo{
  int32 id = 1;
  string sentence = 2;
  int32 creator_id = 3;
}
