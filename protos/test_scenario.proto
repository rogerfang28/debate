syntax = "proto3";

package debate_test;

// A complete test scenario: an ordered list of steps
// Each step has an action (optional) and expectations (optional)
// Steps execute sequentially — action runs, then expectations check.
message TestScenario {
  string name = 1;
  repeated TestStep steps = 2;
}

// One step = optional action + optional expectations
// Both can be empty: action-only (no check), expectation-only (check state), or both.
message TestStep {
  TestAction action = 1;                      // optional — if absent, just check expectations
  repeated TestExpectation expectations = 2;  // optional — if absent, just execute action
}

// A single user action — maps to one DebateEvent or a runner-level operation
message TestAction {
  string username = 1;       // "A", "B", "C" — resolved by the runner
  string event_type = 2;     // matches debate_event::EventType enum name,
                             // or "CREATE_USER" for runner-level user creation

  // Event-specific payloads (only one should be set per action)
  string debate_topic = 3;      // for CREATE_DEBATE
  int32  debate_id = 4;         // for ENTER_DEBATE, JOIN_DEBATE
  int32  claim_id = 5;          // for GO_TO_CLAIM
  string claim_text = 6;        // for ADD_CHILD_CLAIM, SUBMIT_CHALLENGE_CLAIM
  string claim_description = 7; // for ADD_CHILD_CLAIM
  string challenge_description = 8; // for SUBMIT_CHALLENGE_CLAIM

  // Additional supporting claims for ADD_CHILD_CLAIM. claim_text plus these
  // become ONE relation with several from-claims -- "these together support
  // the parent" -- rather than several independent supports.
  repeated string extra_claim_texts = 9;

  string basis = 10;            // for ADD_CHILD_CLAIM; empty means unspecified

  // For ADD_LINK_TO_BE_CHALLENGED: the ARGUMENT to challenge, named by its two
  // ends -- the claim it is for, and the claim offered for it. Link ids are
  // not stable across databases, so whoever runs the scenario resolves the
  // pair to the stored link. A challenge then submitted is an undercut: it
  // says the argument does not follow, not that either claim is false.
  int32 link_to_claim_id = 11;
  int32 link_from_claim_id = 12;

  // WHOSE claim it is, when not the acting user's: "Paul", "the reporter".
  // For CREATE_DEBATE, ADD_CHILD_CLAIM and SUBMIT_CHALLENGE_CLAIM. The
  // acting user types it in; the voice holds it. See debate.Claim.voice_id.
  string voice = 13;
  // Where the claim was taken from, if anywhere. See debate.Source.
  string source_url = 14;
  string source_excerpt = 15;
}

// A single expectation to verify after the action in this step runs
message TestExpectation {
  string check_type = 1;     // CLAIM_EXISTS | CLAIM_SENTENCE | USER_VIEW |
                             // LINK_COUNT | LINK_EXISTS | ENGAGEMENT_STATE |
                             // COLLECTION_SIZE | RELATION_COUNT |
                             // RELATION_FROM_COUNT | RELATION_FROM_EXISTS

  // Target identifiers
  string username = 2;       // whose response collection to check
  int32  claim_id = 3;       // target claim (for CLAIM_*, USER_VIEW)
  int32  from_claim_id = 4;  // for LINK_EXISTS
  int32  to_claim_id = 5;    // for LINK_EXISTS
  string link_type = 6;      // "PARENT_CHILD" | "CHALLENGE" (for LINK_COUNT, LINK_EXISTS)

  // Expected values
  string expected_claim_sentence = 7;  // for CLAIM_SENTENCE
  string expected_status = 8;          // "TRUE_CLAIM" | "FALSE_CLAIM" | "UNDETERMINED" (for USER_VIEW)
  int32  expected_count = 9;           // for LINK_COUNT, COLLECTION_SIZE
  string expected_action = 10;         // "ACTION_DEBATING" | "ACTION_HOME" (for ENGAGEMENT_STATE)
}
