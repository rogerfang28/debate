syntax = "proto3";

package debate2;

import "google/protobuf/timestamp.proto";
import "debate_settings.proto";

// A reference to exactly one element: a claim, or a relation.
//
// A oneof rather than a (kind, id) pair. With kind + id, an unset message
// defaults to {CLAIM, 0}, which is indistinguishable from a genuine pointer to
// claim 0 -- a silent failure. Here ELEMENT_NOT_SET is explicit and detectable.
//
// Proto3 still cannot require at-least-one, and claim_id = 0 can be set
// explicitly, so the write path MUST validate that a target is present and
// non-zero. The oneof does not remove that check; it makes the bug findable.
message DebateElement {
  oneof element {
    int32 claim_id = 1;
    int32 relation_id = 2;
  }
}

// A single claim node in the debate graph.
// Claims are global: one claim can be referenced by relations in many debates,
// which is what makes a claim's cross-debate track record possible.
//
// A claim is immutable. Its wording never changes -- to say something
// different you make a NEW claim and the old one becomes SUPERSEDED.
message Claim {
  // Fields 11 and 13 held a stored status and a per-viewer status map. They are
  // reserved, not merely deprecated: status is COMPUTED from the move log on
  // every read and is never stored. A stored status can contradict the log --
  // e.g. show "standing" while a live unanswered attack exists -- so the field
  // must be unreachable, not just discouraged.
  reserved 11, 13;
  reserved "status", "user_statuses";

  int32 id = 1;
  string text = 2;
  string description = 3;
  int32 author_id = 8;
  // Legacy: claims are global now, so a claim is not scoped to one debate.
  int32 debate_id = 9;
  // Legacy: per-claim history is superseded by the append-only Move log.
  repeated ClaimState history = 10;
  // Legacy: relations are looked up by target, not cached on the claim.
  repeated int32 link_ids = 12;

  google.protobuf.Timestamp created_at = 14;
}

message ClaimState {
  google.protobuf.Timestamp timestamp = 2;
  Claim claim = 1;
}

// A relation is a directed hyperedge: a SET of claims (from_claim_ids) pointing
// at ONE target (to), which may itself be another relation. Relations are
// debate-scoped even though claims are global -- the argument structure is what
// belongs to a debate.
//
// Several claims in ONE relation's from-set means "all needed together" (AND).
// Several SEPARATE relations to the same target means "any one is enough" (OR).
// A relation with exactly one from-member is an ordinary claim-to-claim edge.
message Relationship {
  int32 id = 1;
  int32 debate_id = 2;
  // The hyperedge tail. More than one member means all are required.
  repeated int32 from_claim_ids = 3;
  // The one target: a claim, or another relation. Targeting a relation is what
  // makes "the evidence is fine, but it doesn't prove that" expressible.
  // Must be present and non-zero -- proto3 cannot enforce this, so the write
  // path validates it. An absent target is a dangling node.
  DebateElement to = 4;
  RelationRole role = 5;
  Basis basis = 6;
  int32 creator_id = 7;
  google.protobuf.Timestamp created_at = 10;
}

// Whether a relation props its target up or attacks it.
enum RelationRole {
  SUPPORTS = 0;
  OPPOSES = 1;
}

// What KIND of connection a relation is. A basis answers exactly one
// engine-facing question: when this relation is defeated, what happens to its
// target? Everything else about a basis is user-interface text.
//
// A proposed basis is only real if its defeat behaviour is one of exactly
// four: collapse, unsupport, fork, or don't-propagate. Most "new argument
// types" are not new bases -- causal, statistical, analogical, testimonial and
// historical reasoning all behave identically here, so they are EVIDENTIAL and
// their differences are menu text. The test is whether the engine does
// anything different. If not, it is not a basis.
enum Basis {
  // "The data or reasoning shows..." -> target becomes UNSUPPORTED.
  EVIDENTIAL = 0;
  // "This source vouches for it" -> UNSUPPORTED, NEVER COLLAPSED. Attacking a
  // source dents trust, not truth, and matters only as much as the target
  // actually leaned on that source.
  AUTHORITY = 1;
  // "True under this meaning of the word" -> fails under that lens only; a
  // relation carrying a different definition is untouched.
  DEFINITIONAL = 2;
  // "A reason for or against a should" -> scoreboard only. Never resolves to
  // true or false.
  NORMATIVE = 3;
}

// The computed health of a claim or relation. NEVER stored -- always derived
// from the move log, per (claim, debate). Sent to clients for rendering only.
//
// Two distinctions the display must preserve:
//   UNSUPPORTED is not COLLAPSED. "You haven't shown this" is not "this is
//   false" -- breaking someone's reasoning leaves the claim arguable.
//   STANDING means "unchallenged so far", NOT "verified". An unattacked bare
//   assertion is STANDING. It must never render as a verdict.
//
// Ties are broken by a precedence ladder, highest first:
//   SUPERSEDED > COLLAPSED > MISDIRECTED > UNRESOLVED > CONTESTED
//     > UNSUPPORTED > ABANDONED > OPEN > ACCEPTED > STANDING
// CIRCULAR is deliberately off the ladder: it is not an outcome but a finding
// about support, resolving to "contributes nothing", which then feeds the
// ladder normally.
enum Status {
  STANDING = 0;     // supported or unattacked; "unchallenged so far"
  OPEN = 1;         // under challenge, unresolved
  UNSUPPORTED = 2;  // no backing left, NOT disproven
  COLLAPSED = 3;    // refuted or conceded; cascades to dependents
  CONTESTED = 4;    // both sides have surviving evidence; strength not weighed
  UNRESOLVED = 5;   // genuinely unknown; nobody has the evidence
  ABANDONED = 6;    // nobody answered in time
  SUPERSEDED = 7;   // replaced by an amended or reworded version
  ACCEPTED = 8;     // every active adversarial party marked it common ground
  CIRCULAR = 9;     // support loops back on itself; proves nothing on its own
  MISDIRECTED = 10; // relations only: attack aimed at a claim nobody made
}

// What a person did. Each action a user takes writes exactly one move.
// Adding a type is a real change, not a config edit -- old logs must still
// replay -- so unlike basis this stays an enum.
enum MoveType {
  ASSERT = 0;       // state something; may carry a new claim and/or relation
  OPPOSE = 1;       // attack a claim, or attack a relation (break the link)
  CONCEDE = 2;      // give up a claim -> COLLAPSED
  ACCEPT = 3;       // mark as common ground; also Restate's consent event
  REST = 4;         // done on this branch
  FLAG_UNKNOWN = 5; // nobody has the evidence -> UNRESOLVED
  REPLACE = 6;      // amend, restate, or split; old claim -> SUPERSEDED
  DISOWN = 7;       // "I did not assert or imply that" -- itself opposable
  REOPEN = 8;       // revisit a settled branch; requires new grounds
  TIMEOUT = 9;      // written when someone goes quiet; never user-pressed
}

// A logged action. THE ONLY THING STORED.
//
// The log is append-only: never updated, never deleted. A retraction is a new
// move. Every status on screen is recomputed from this list, which is what
// makes the map unable to contradict itself, makes rewind honest, and makes
// shared evidence update everywhere at once.
//
// Ordering is by id within a debate; no separate sequence field, since the
// id is already monotonic and a hand-maintained counter would race.
message Move {
  int32 id = 1;
  int32 debate_id = 2;
  int32 actor_id = 3;
  MoveType type = 4;
  // What was acted on. Absent only for a root ASSERT that starts a debate.
  DebateElement target = 5;
  // What this move created, if anything. A single move can produce both --
  // supporting a claim asserts a new claim AND the relation carrying it.
  int32 payload_claim_id = 6;
  int32 payload_relation_id = 7;
  // Free text the move type calls for: REOPEN's new grounds, FLAG_UNKNOWN's
  // reason. Never read by the engine.
  string note = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

message Debate {
  int32 id = 1;
  int32 root_claim_id = 2;
  string topic = 3;
  repeated int32 debater_ids = 4;
  int32 creator_id = 5;
  debate.DebateSettings settings = 6;
  bool is_challenge = 7;
  int32 parent_challenge_id = 8;
}
