# Learn more: https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2

inputs:
  - directory: protos

plugins:

  # TypeScript: all protos → src/gen/ts/
  - local: protoc-gen-es
    opt:
      - target=ts
    out: src/gen/ts

  # C++ backend: all protos -> src/gen/cpp/
  # This must stay src/gen/cpp -- backend/CMakeLists.txt and test/CMakeLists.txt
  # both glob "${REPO_ROOT}/src/gen/cpp/*.pb.cc". Generating anywhere else means
  # `npx buf generate` appears to succeed while the build keeps using stale code.
  - remote: buf.build/protocolbuffers/cpp:v33.4
    out: src/gen/cpp
